<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Assinatura de Email</title>
    <link rel="shortcut icon" href="/static/logo-.png" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #0a2e5c 0%, #1565c0 50%, #29b6d8 100%);
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(10, 46, 92, 0.35);
            padding: 32px;
            width: 100%;
            max-width: 620px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 14px;
        }
        .full {
            grid-column: 1 / -1;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #0a2e5c;
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 13px;
            color: #6b7a90;
            text-align: center;
            margin-bottom: 24px;
        }
        .field {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #37474f;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #dde3ea;
            border-radius: 10px;
            font-size: 14px;
            color: #263238;
            background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #1565c0;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
        }
        input[type="file"] {
            width: 100%;
            font-size: 13px;
            color: #546e7a;
        }
        input[type="file"]::file-selector-button {
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            background: #e3f0fb;
            color: #1565c0;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-right: 10px;
            transition: background 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            background: #cfe3f8;
        }
        .hint {
            font-size: 12px;
            color: #90a4ae;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #1565c0, #29b6d8);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(21, 101, 192, 0.35);
        }
        button:active {
            transform: translateY(0);
        }
        @media (max-width: 520px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Gerador de Assinatura</h1>
        <p class="subtitle">Preencha os dados para criar sua assinatura de email</p>

        <form action="/generate_signature" method="post" enctype="multipart/form-data">
            <div class="grid">
                <div class="field full">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" name="name" placeholder="Maria Silva" required>
                </div>

                <div class="field">
                    <label for="title">Cargo</label>
                    <input type="text" id="title" name="title" placeholder="Analista de TI" required>
                </div>

                <div class="field">
                    <label for="department">Departamento</label>
                    <input type="text" id="department" name="department" placeholder="Tecnologia" required>
                </div>

                <div class="field">
                    <label for="phone">Telefone</label>
                    <input type="tel" id="phone" name="phone" placeholder="(82) 99999-0000" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="voce@empresa.com.br" required>
                </div>

                <div class="field">
                    <label for="website">Site</label>
                    <input type="text" id="website" name="website" placeholder="empresa.com.br">
                </div>

                <div class="field">
                    <label for="background">Imagem de fundo</label>
                    <input type="file" id="background" name="background" accept="image/*">
                    <p class="hint">Opcional. 300–400 × 70–100 px.</p>
                </div>
            </div>

            <button type="submit">Gerar Assinatura</button>
        </form>
    </div>
</body>
</html>
