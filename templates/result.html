<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura Gerada</title>
    <link rel="shortcut icon" href="/static/logo-.png" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 24px;
            background: linear-gradient(135deg, #0a2e5c 0%, #1565c0 50%, #29b6d8 100%);
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(10, 46, 92, 0.35);
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 15px;
            font-weight: 600;
            color: #0a2e5c;
            margin-bottom: 6px;
        }
        .card p.desc {
            font-size: 13px;
            color: #6b7a90;
            margin-bottom: 14px;
        }
        .preview {
            background: #f8fafc;
            border: 1px solid #e3e8ef;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .preview img {
            max-width: 100%;
        }
        .btn {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #1565c0, #29b6d8);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            margin-right: 8px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(21, 101, 192, 0.35);
        }
        .btn.secondary {
            background: #eceff1;
            color: #37474f;
        }
        .btn.secondary:hover {
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
        }
        #copy-msg {
            display: none;
            color: #2e7d32;
            font-size: 13px;
            font-weight: 600;
        }
        #source {
            width: 100%;
            height: 160px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            border: 1px solid #dde3ea;
            border-radius: 10px;
            padding: 10px;
            display: none;
            margin-top: 14px;
            resize: vertical;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #664d03;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .back {
            text-align: center;
        }
        .back a {
            color: #ffffff;
            font-size: 14px;
            text-decoration: none;
            opacity: 0.9;
        }
        .back a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assinatura gerada</h1>

        {% if warning %}
        <div class="warning">{{ warning }}</div>
        {% endif %}

        <div class="card">
            <h2>Imagem (PNG)</h2>
            <p class="desc">400 × 85 px — dentro do tamanho recomendado para assinaturas.</p>
            <div class="preview">
                <img src="/static/assinatura_email.png" alt="Assinatura de Email">
            </div>
            <a class="btn" href="/download">Baixar PNG</a>
        </div>

        <div class="card">
            <h2>Versão HTML (recomendada)</h2>
            <p class="desc">Copie e cole no editor de assinaturas do seu cliente de email.</p>
            <div class="preview" id="signature">{{ signature_html|safe }}</div>
            <button class="btn" onclick="copySignature()">Copiar assinatura</button>
            <button class="btn secondary" onclick="toggleSource()">Ver código HTML</button>
            <span id="copy-msg">Copiado!</span>
            <textarea id="source" readonly>{{ signature_html }}</textarea>
        </div>

        <p class="back"><a href="/">&larr; Nova assinatura</a></p>
    </div>

    <script>
        async function copySignature() {
            const el = document.getElementById('signature');
            try {
                await navigator.clipboard.write([
                    new ClipboardItem({
                        'text/html': new Blob([el.innerHTML], { type: 'text/html' }),
                        'text/plain': new Blob([el.innerText], { type: 'text/plain' })
                    })
                ]);
            } catch (e) {
                const range = document.createRange();
                range.selectNodeContents(el);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                document.execCommand('copy');
                sel.removeAllRanges();
            }
            const msg = document.getElementById('copy-msg');
            msg.style.display = 'inline';
            setTimeout(() => msg.style.display = 'none', 3000);
        }

        function toggleSource() {
            const src = document.getElementById('source');
            src.style.display = src.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
